
# Core Shell & Logging
CONFIG_SHELL=y
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_LOG=y
# Routes log output through shell line-management
CONFIG_SHELL_LOG_BACKEND=y

# Disable raw UART logging backend to prevent collisions
CONFIG_LOG_BACKEND_UART=n

# Deferred logging is essential so shell threads handle output formatting
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_PWM=y